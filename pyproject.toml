[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataveil"
version = "0.4.0"
description = "Local data profiling, PII classification, and plan-based cleansing — aggregate-only, no LLM-authored code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Zain Ul Abdin" }]
keywords = ["data-governance", "pii", "data-quality", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = ['tomli>=1.1; python_version < "3.11"']

[project.optional-dependencies]
duckdb = ["duckdb>=1.0.0", "numpy>=1.24"]
sqlmesh = ["sqlmesh>=0.236.0"]
postgres = ["sqlalchemy>=2.0.0", "psycopg2-binary>=2.9.0"]
mcp = ["mcp>=2.0.0"]
ner = ["spacy>=3.7"]
docs = ["mkdocs-material>=9.5", "mkdocs>=1.6,<2"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "duckdb>=1.0.0",
    "numpy>=1.24",
    "sqlmesh>=0.236.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "mcp>=2.0.0",
    "spacy>=3.7",
    "faker>=20.0.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
dataveil-mcp = "dataveil.server:main"

# The built-in adapters and classifiers register like any plugin.
[project.entry-points."dataveil.adapters"]
duckdb = "dataveil.adapters.factories:duckdb_adapter"
postgres = "dataveil.adapters.factories:postgres_adapter"
sqlmesh = "dataveil.adapters.factories:sqlmesh_adapter"

[project.entry-points."dataveil.classifiers"]
builtin = "dataveil.core.classify:CLASSIFIERS"

[project.urls]
Homepage = "https://github.com/Zain-ul-Abdin45/dataveil"
Issues = "https://github.com/Zain-ul-Abdin45/dataveil/issues"

[tool.hatch.build.targets.wheel]
packages = ["dataveil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Longer than sqlmesh-mcp's 100: several lines here are generated SQL
# f-strings that don't wrap cleanly.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
# The optional backends (duckdb, sqlmesh, sqlalchemy, mcp) are not all typed.
ignore_missing_imports = true
