name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATAVEIL_TEST_POSTGRES_URL: postgresql+psycopg2://postgres@localhost/dataveil_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m spacy download en_core_web_sm
      - run: ruff check dataveil tests examples
      - run: ruff format --check dataveil tests examples
      - run: mypy dataveil
      - run: psql -h localhost -U postgres -c "CREATE DATABASE dataveil_test;"
      - run: pytest
      - run: python examples/messy_customers.py
